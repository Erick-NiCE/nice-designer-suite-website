  <!--
    ===== lynn-ui: the site chrome, as React components =====
    The access gate, the nav and (on pages that have them) the footer and the
    doc rail all come from lynn-ui now - see the single #lynn-app-root mount
    script at the end of <body>. site-gate.css / site-gate.js are gone with
    them; `AccessGate` is the same screen and the mount script re-runs the
    same client-side code check.

    Three things are needed, and none of them affect the rest of the page:
      1. dist/lynn-ui.css - the package's built stylesheet. Everything in it
         is either a `--lynn-*` custom property or a `.lynn-*` class, so it
         cannot collide with this page's own tokens/classes.
      2. the import map  - React, ReactDOM and matter-js as CDN ESM.
         `?external=react` on react-dom stops a second copy of React being
         pulled in ("invalid hook call"). matter-js is in the map because
         dist/index.js is one barrel that also reaches LiquidFill.
      3. `.lynn-mount` - the chrome renders through portals into placeholder
         divs left where the old markup was. `display: contents` means those
         placeholders generate no box, so the sticky nav and the footer's
         margin still resolve against <body> exactly as before.
  -->
  <link rel="stylesheet" href="./lynn-ui/dist/lynn-ui.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "scheduler": "https://esm.sh/scheduler@0.23.2",
      "matter-js": "https://esm.sh/matter-js@0.20.0"
    }
  }
  </script>
  <style>.lynn-mount { display: contents; }</style>

  <!--
    The gate used to be static markup covered by blocking CSS, so it was up
    before first paint. React arrives as ESM from a CDN, so the component
    can only mount a tick later - hold the page back until it does, or a
    locked visitor reads the whole page in the gap. Costs nothing once the
    session is unlocked (the class is never added), and a 4s failsafe means
    a CDN that never answers leaves a readable page rather than a blank one.
  -->
  <style>html.lynn-gate-pending body { visibility: hidden; }</style>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('nice-site-access') === '1') return;
      } catch (e) { /* blocked storage: fall through and gate */ }
      var root = document.documentElement;
      root.classList.add('lynn-gate-pending');
      setTimeout(function () { root.classList.remove('lynn-gate-pending'); }, 4000);
    })();
  </script>

    // The changelog collapsibles used to be wired up here. <ChangelogEntry>
    // owns its own toggle (and its own aria-expanded / aria-controls), so
    // there is nothing left for this page to bind.

    // Scroll reveal via IntersectionObserver. Only the hero's `.reveal` is
    // left to observe - the changelog cards are React-rendered and come in
    // already visible.
    var revealTargets = document.querySelectorAll('.reveal');

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.08,
      rootMargin: '0px 0px -32px 0px'
    });

    revealTargets.forEach(function(el) {
      observer.observe(el);
    });
  </script>

    /* The nav's single action slot, unchanged from the markup it replaces:

    const downloadPill = (key) =>

        { key, className: 'nav-download is-disabled', 'aria-disabled': 'true' },
        'Download',
        h('span', { className: 'coming-soon-tag' }, 'Coming soon!')

    /* ThemeProvider stamps `data-lynn-theme` on its own wrapper div, but the
       portalled chrome lives outside that div - so mirror the attribute onto

       to the whole document. */
    function ThemeBridge() {
      const { theme } = useLynnTheme();
      useEffect(() => {
        document.documentElement.setAttribute('data-lynn-theme', theme);
      }, [theme]);
      return null;
    }

    function portal(node, id) {
      const host = document.getElementById(id);
      return host ? createPortal(node, host) : null;
    }

    function App() {
      const [unlocked, setUnlocked] = useState(() => {
        try {
          return sessionStorage.getItem(GATE_KEY) === '1';
        } catch (e) {
          return false;
        }
      });
      const [error, setError] = useState(undefined);
      const [railCollapsed, setRailCollapsed] = useState(() => {
        try {
          return localStorage.getItem(RAIL_KEY) === '1';
        } catch (e) {
          return false;
        }
      });

      useEffect(() => {
        // The chrome is up; let the page paint (see the gate-pending guard
        // in <head>).
        document.documentElement.classList.remove('lynn-gate-pending');
        // The hover spotlight the page's own polish script used to stamp on
        // the static changelog cards.
        document
          .querySelectorAll('.lynn-changelog-card')
          .forEach((card) => card.classList.add('tilt-ready'));
        // The cards used to be static markup, so the browser could honour a
        // `#release-v9` deep link on load. They render a tick later now, by
        // which time that jump has already failed - so re-run it.
        const hash = location.hash.slice(1);
        if (hash) {
          const target = document.getElementById(hash);
          if (target) target.scrollIntoView();
        }
      }, []);

      // Cmd+K / Ctrl+K opens the rail and focuses its filter box - the
      // shortcut buildDocRail() used to own.
      useEffect(() => {
        function onKeyDown(event) {
          if (event.key !== 'k' && event.key !== 'K') return;
          if (!(event.metaKey || event.ctrlKey)) return;
          event.preventDefault();
          setRail(false);
          const input = document.querySelector('.lynn-doc-rail-search');
          if (input) {
            input.focus();
            input.select();
          }
        }
        document.addEventListener('keydown', onKeyDown);
        return () => document.removeEventListener('keydown', onKeyDown);
      }, []);

      const checkCode = (code) => {
        if (code === GATE_PASSWORD) {
          try {
            sessionStorage.setItem(GATE_KEY, '1');
          } catch (e) { /* unwritable store just means no persistence */ }
          setError(undefined);
          setUnlocked(true);
        } else {
          setError(GATE_ERROR);
        }
      };

      const setRail = (collapsed) => {
        setRailCollapsed(collapsed);
        try {
          localStorage.setItem(RAIL_KEY, collapsed ? '1' : '0');
        } catch (e) { /* no persistence, still collapses for this visit */ }
      };

      return h(
        Fragment,
        null,
        h(ThemeBridge, { key: 'theme-bridge' }),
        h(AccessGate, {
          key: 'gate',
          title: 'NiCE Designer Site Login',
          subtitle:
            'This is the login for the NiCE Designer website as a whole. Enter the site-wide access code to continue.',
          onSubmit: checkCode,
          error,
          unlocked,
          ctaText: h(
            Fragment,
            null,
            "Don't have the code?",
            h('br'),
            h('strong', null, 'Reach out to Erick Mathews on Teams'),
            ' to request access.'
          ),
          ctaHref: TEAMS_HREF,
        }),
        portal(
          h(Nav, {
            logoHref: './index.html',
            cta: h(Fragment, null, [
              h(ThemeToggle, { key: 'theme', showLabels: false }),
              downloadPill('download'),
            ]),
          }),
          'lynn-nav-root'
        ),
        portal(
          h(DocRail, {
            mode: 'pages',
            pages: railPages,
            groups: railGroups,
            activeHref: './' + PAGE,
            searchable: true,
            collapsed: railCollapsed,
            onToggle: setRail,
          }),
          'lynn-docrail-root'
        ),
        portal(
          h(
            Fragment,
            null,
            RELEASES.map((release) => h(ChangelogEntry, { ...release, key: release.id }))
          ),
          'lynn-changelog-root'
        ),
        portal(
          h(Footer, { columns: FOOTER_COLUMNS }),
          'lynn-footer-root'
        )
      );
    }

    createRoot(document.getElementById('lynn-app-root')).render(
      h(ThemeProvider, { defaultTheme: 'lynn' }, h(App))
    );
  </script>

</body>
</html>
