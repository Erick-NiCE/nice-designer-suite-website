<!-- NiCE Designer fallback pattern: filter toolbar that sits under the page header. Search is a real kit Text Input, the filters are real kit Chips; this only lays them out. Active filter chips use the Chip's selected state. -->
<div class="nds-toolbar" role="search" data-nds-source="fallback">
  <div class="nds-toolbar-search"><!-- real kit Text Input with a search icon --></div>
  <!-- real kit Chips: "Group", "Team", "Status" ... -->
  <button type="button" class="nds-add-filter body-md-emphasized">+ Add filter</button>
  <button type="button" class="nds-clear-link body-md-emphasized">Clear</button>
</div>
