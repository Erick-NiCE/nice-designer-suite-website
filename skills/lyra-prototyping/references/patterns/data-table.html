<!-- NiCE Designer fallback pattern: static data table (the kit's Grid needs its grid runtime). Use th scope, a caption, data-numeric on number columns, and nds-pill cells for status. -->
<div class="nds-table-wrap" data-nds-source="fallback">
  <table class="nds-table body-md">
    <caption class="heading-sm">Queues</caption>
    <thead><tr><th scope="col">Queue</th><th scope="col" data-numeric>Waiting</th><th scope="col" data-numeric>Longest wait</th><th scope="col">Status</th></tr></thead>
    <tbody>
      <tr><td>Billing</td><td data-numeric>12</td><td data-numeric>02:41</td><td><span class="nds-pill body-sm" data-status="warning">Busy</span></td></tr>
      <tr><td>Support</td><td data-numeric>4</td><td data-numeric>00:48</td><td><span class="nds-pill body-sm" data-status="success">Healthy</span></td></tr>
    </tbody>
  </table>
</div>
