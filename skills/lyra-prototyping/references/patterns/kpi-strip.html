<!-- NiCE Designer fallback pattern: a strip of 4 to 6 key figures under the toolbar. Each is the stat pattern; the card for the filter currently applied gets aria-current="true" for the active treatment. Number color may encode status, and the status must also be in the text. -->
<div class="nds-kpi-strip" data-nds-source="fallback">
  <div class="nds-stat"><span class="nds-stat-label body-md">Calls waiting</span><p class="nds-stat-value heading-xl">37</p><span class="nds-stat-delta body-sm" data-trend="bad">+4 vs 15 min ago</span></div>
  <div class="nds-stat" aria-current="true"><span class="nds-stat-label body-md">Service level</span><p class="nds-stat-value heading-xl">84%</p><span class="nds-stat-delta body-sm" data-trend="bad">-2 pts</span></div>
  <div class="nds-stat"><span class="nds-stat-label body-md">Longest wait</span><p class="nds-stat-value heading-xl">02:41</p><span class="nds-stat-delta body-sm" data-trend="good">-0:20</span></div>
</div>
