  <!--
    ===== lynn-ui: the site chrome, as React components =====
    The access gate, the nav, the hero, the featured carousel and the footer
    all come from lynn-ui now - see the single #lynn-app-root mount script at
    the end of <body>. site-gate.css / site-gate.js are gone with them;
    `AccessGate` is the same screen and the mount script re-runs the same
    client-side code check. This page has no doc rail - it is in
    nice-effects.js's own `DOC_RAIL_SKIP` list, same as before the migration.

    Three things are needed, and none of them affect the rest of the page:
      1. dist/lynn-ui.css - the package's built stylesheet. Everything in it
         is either a `--lynn-*` custom property or a `.lynn-*` class, so it
         cannot collide with this page's own tokens/classes.
      2. the import map  - React, ReactDOM and matter-js as CDN ESM.
         `?external=react` on react-dom stops a second copy of React being
         pulled in ("invalid hook call"). matter-js is in the map because
         dist/index.js is one barrel that also reaches LiquidFill.
      3. `.lynn-mount` - the chrome renders through portals into placeholder
         divs left where the old markup was. `display: contents` means those
         placeholders generate no box, so the sticky nav and the footer's
         margin still resolve against <body> exactly as before.
  -->
  <link rel="stylesheet" href="./lynn-ui/dist/lynn-ui.css?v=1" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "scheduler": "https://esm.sh/scheduler@0.23.2",
      "matter-js": "https://esm.sh/matter-js@0.20.0"
    }
  }
  </script>
  <style>.lynn-mount { display: contents; }</style>

  <!--
    The gate used to be static markup covered by blocking CSS, so it was up
    before first paint. React arrives as ESM from a CDN, so the component
    can only mount a tick later - hold the page back until it does, or a
    locked visitor reads the whole page in the gap. Costs nothing once the
    session is unlocked (the class is never added), and a 4s failsafe means
    a CDN that never answers leaves a readable page rather than a blank one.
  -->
  <style>html.lynn-gate-pending body { visibility: hidden; }</style>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('nice-site-access') === '1') return;
      } catch (e) { /* blocked storage: fall through and gate */ }
      var root = document.documentElement;
      root.classList.add('lynn-gate-pending');
      setTimeout(function () { root.classList.remove('lynn-gate-pending'); }, 4000);
    })();
  </script>

  <style>
    /* ========== HERO CTAs ========== */
    /* The hero shell itself (background, orbs, radial mask, title, subtitle)
       is lynn-ui's <Hero> now (see the mount script) - it was built
       specifically to match this page's own three-orb look. What is left
       here is the disabled "Download" pill and the version badge, both of
       which stay literal markup (not a real <Button>) because downloads.js
       reads their `data-latest-*` attributes at runtime. */
    .hero-ctas {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(54, 148, 252, 0.35);
    }

    .btn-primary:hover {
      background: #4fa3ff;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(54, 148, 252, 0.5);
    }

    .btn-primary.is-disabled {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-primary.is-disabled:hover {
      background: rgba(255,255,255,0.08);
      transform: none;
      box-shadow: none;
    }

    .hero-badge {
      display: inline-block;
      color: var(--emerald);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .hero-badge:hover,
    .hero-badge:focus-visible {
      border-bottom-color: currentColor;
      opacity: 0.85;
    }

    /* ========== SECTIONS ========== */
    .page-section {
      padding: 80px 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .section-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 560px;
    }

    /* ========== PILLARS (lynn-ui <IconCard layout="vertical">) ========== */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 48px;
    }

    @media (max-width: 900px) {
      .pillars-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ========== DOCS GRID (lynn-ui <FeatureCard density="compact">) ====== */
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 48px;
    }

    @media (max-width: 1024px) {
      .docs-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .docs-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Each doc card is a real link (the whole `.doc-card` used to be the
       `<a>`) wrapping a FeatureCard; the arrow row is the one bit of the old
       markup FeatureCard has no slot for, so it rides in as `children`. */
    .lynn-doc-card-link {
      display: block;
      text-decoration: none;
      color: inherit;
      /* The hover spotlight below (`.tilt-ready::after`) clips to this
         element's own border-radius, not the `FeatureCard` it wraps - with
         none set here it defaulted to square corners, so the glow's corner
         poked out past the card's own rounded one. Match FeatureCard's
         `--lynn-radius-lg`. */
      border-radius: var(--lynn-radius-lg);
    }

    .lynn-doc-card-arrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 20px;
      opacity: 0.7;
      transition: opacity 0.2s, gap 0.2s;
    }

    .lynn-doc-card-link:hover .lynn-doc-card-arrow {
      opacity: 1;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .page-section {
        padding: 60px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- lynn-ui chrome. One React root, one ThemeProvider (see the mount
       script at the end of <body>); the gate renders inside it, everything
       else portals into the `.lynn-mount` placeholders below. -->
  <div id="lynn-app-root"></div>

  <!-- NAV (lynn-ui <Nav>). No doc rail on this page - see the comment in
       <head>. -->

  <!-- HERO (lynn-ui <Hero>) -->

  <!-- FEATURED PAGES (lynn-ui <Carousel>, same React tree/ThemeProvider as
       the rest of the chrome now - see the mount script for why this used
       to be a second, independent root and no longer is). -->
  <div class="page-section reveal" style="padding-bottom: 0;">

    <h2 class="section-title">Start here</h2>

    <div id="lynn-carousel-root" style="max-width: 900px; margin: 0 auto;"></div>
  </div>

  <!-- WHAT CAN IT DO (lynn-ui <IconCard layout="vertical">) -->
  <div class="page-section reveal">
    <div class="section-label">What can it do</div>
    <h2 class="section-title">Built around what you need to get done</h2>
    <p class="section-subtitle">Whatever seat you're in, NiCE Designer takes a specific job off your plate.</p>
    <div class="pillars-grid" id="lynn-pillars-root"></div>
  </div>

  <!-- DOCS GRID (lynn-ui <FeatureCard density="compact">, each wrapped in
       its real link) -->
  <div class="page-section reveal" style="padding-top: 0;">

  <!-- FOOTER (lynn-ui <Footer>) -->
  <div id="lynn-footer-root" class="lynn-mount"></div>

  <!-- NICE POLISH EFFECTS -->
  <style>
    /* Positional hover: tilt + spotlight on interactive cards */
    .tilt-ready {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), box-shadow 0.4s ease;
    }
    .tilt-ready::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,0.09) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 1;
    }
    .tilt-ready:hover::after { opacity: 1; }

    /* Magnetic buttons. `.nav-cta` / `.cta-btn` / `.roadmap-link` had no
       matching element left on this page once the nav and its CTA became
       lynn-ui's <Nav>, so only the hero's disabled download pill remains. */
    .btn-primary {
      transition: transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease !important;
    }

    /* Cursor ambient glow */
    #nice-cursor-glow {
      position: fixed;
      pointer-events: none;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(54,148,252,0.055) 0%,
        rgba(97,0,255,0.025) 40%,
        transparent 70%);
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: left 0.08s linear, top 0.08s linear, opacity 0.5s ease;
      opacity: 0;
      mix-blend-mode: screen;
    }

    /* Scroll reveal: fade + slide up */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.55s cubic-bezier(0.23,1,0.32,1),
                  transform 0.55s cubic-bezier(0.23,1,0.32,1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>

  <script>
  (function() {
    // Cursor ambient glow
    var glow = document.createElement('div');
    glow.id = 'nice-cursor-glow';
    document.body.appendChild(glow);
    var glowX = window.innerWidth / 2, glowY = window.innerHeight / 2;
    document.addEventListener('mousemove', function(e) {
      glowX = e.clientX; glowY = e.clientY;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', function() { glow.style.opacity = '0'; });

    // Apply tilt + spotlight to cards. `.lynn-doc-card-link` is deliberately
    // NOT in this list even though it is the lynn-ui replacement for
    // `.doc-card` - unlike every other card here, it is a real navigation
    // `<a>`, and this effect writes a fresh `transform` on every `mousemove`.
    // A real click's `mousedown`/`mouseup` are rarely at the exact same
    // pixel, so the tilt can visibly shift the link out from under the
    // cursor between the two - the browser then has no single element both
    // events agree on, and no `click` fires at all. `FeatureCard` already
    // has its own CSS `:hover` lift, so the card still feels alive without
    // JS fighting its own hit-testing. The pillar cards were never in this
    // list even pre-migration (only the generic `.pillar` selector was,
    // which never matched `.pillar-card`). All mount after this script
    // runs, so `polish()` is exposed on `window.NicePolish` for the mount
    // script to call once they exist.
    var SELECTORS = [
      '.tool-card', '.skill-card', '.phase-block', '.case-card',
      '.pillar', '.step-card', '.score-card', '.sp-card',
      '.sp-callout-card', '.stat-card', '.dl-card',
      '.faq-item', '.checklist-item', '.tool-mini', '.gate-card',
      '.score-band', '.audit-cat', '.workflow-card', '.case-scenario'
    ].join(', ');

    function polish(cards) {
      cards.forEach(function(card) {
        if (card.dataset.nicePolished === '1') return;
        card.dataset.nicePolished = '1';
        card.classList.add('tilt-ready');

        card.addEventListener('mousemove', function(e) {
          var r = card.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width;
          var y = (e.clientY - r.top) / r.height;
          // Spotlight CSS vars
          card.style.setProperty('--mx', (x * 100) + '%');
          card.style.setProperty('--my', (y * 100) + '%');
          // 3D tilt (gentle, max 7deg)
          var tx = (y - 0.5) * -8;
          var ty = (x - 0.5) * 8;
          card.style.transform = 'perspective(900px) rotateX(' + tx + 'deg) rotateY(' + ty + 'deg) translateZ(3px)';
          card.style.transition = 'transform 0.07s ease';
          // Glow border hint
          card.style.boxShadow = '0 8px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(54,148,252,0.18)';
        });

        card.addEventListener('mouseleave', function() {
          card.style.transform = '';
          card.style.transition = 'transform 0.45s cubic-bezier(0.23,1,0.32,1)';
          card.style.boxShadow = '';
          card.style.setProperty('--mx', '50%');
          card.style.setProperty('--my', '50%');
        });
      });
    }

    polish([].slice.call(document.querySelectorAll(SELECTORS)));

    // Magnetic effect on the one primary action left on the page
    document.querySelectorAll('.btn-primary').forEach(function(btn) {
      btn.addEventListener('mousemove', function(e) {
        var r = btn.getBoundingClientRect();
        var dx = (e.clientX - r.left - r.width / 2) * 0.28;
        var dy = (e.clientY - r.top - r.height / 2) * 0.28;
        btn.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.04)';
        btn.style.transition = 'transform 0.12s ease';
      });
      btn.addEventListener('mouseleave', function() {
        btn.style.transform = '';
        btn.style.transition = 'transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
      });
    });

    // Scroll reveal - fires on every `.reveal` element (the three page
    // sections; the hero, nav, footer and carousel/card content inside them
    // are lynn-ui now and animate on their own terms).
    var ro = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var delay = parseInt(entry.target.dataset.polishDelay || 0);
          setTimeout(function() {
            entry.target.classList.add('visible');
          }, delay);
          ro.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -24px 0px' });

    function observeReveal(els) {
      els.forEach(function(el, i) {
        el.dataset.polishDelay = (i % 6) * 55;
        ro.observe(el);
      });
    }

    observeReveal([].slice.call(document.querySelectorAll('.reveal')));

    // Handed to the lynn-ui mount script, whose cards do not exist yet.
    window.NicePolish = { polish: polish, observeReveal: observeReveal };
  })();
  </script>

  <script src="downloads.js"></script>

  <!--
    ===== lynn-ui mount =====
    One createRoot, one ThemeProvider, one <App>: the access gate, the nav,
    the hero, the featured carousel, the pillar cards, the docs grid and the
    footer. Keeping them in a single root is what keeps the theme in sync
    between them - the carousel used to mount its own second root and its own
    ThemeProvider here, which is exactly the two-disconnected-themes bug that
    was just fixed on lynn.html by consolidating everything into one tree.

    Anything that belongs elsewhere in the document is placed with
    createPortal into a `.lynn-mount` placeholder rather than rendered here: a
    footer rendered next to the nav would sit at the top of the page, and a
    nav rendered inside a 60px wrapper could not be sticky. The carousel and
    the two card grids portal into their own real (non-`.lynn-mount`) grid
    containers instead, so the page's own `pillars-grid` / `docs-grid` CSS
    still lays them out.
  -->
  <script type="module">
    import { createElement as h, Fragment, useEffect, useState } from 'react';
    import { createPortal } from 'react-dom';
    import { createRoot } from 'react-dom/client';
    import {
      AccessGate,
      Carousel,
      FeatureCard,
      Footer,
      Hero,
      IconCard,
      Nav,
      ShimmerText,
      ThemeProvider,
      ThemeToggle,
      useLynnTheme,
    } from './lynn-ui/dist/index.js?v=2';

    const PAGE = 'index.html';

    /* ---- the real gate, ported from site-gate.js ------------------------ */
    /* Same session key, same password, same message, same Teams link. Still
       a soft deterrent, not security - the check is client-side and readable
       right here, exactly as it was in site-gate.js. */
    const GATE_KEY = 'nice-site-access';
    const GATE_PASSWORD = 'niceux';
    const GATE_ERROR = 'Incorrect code. Contact Erick Mathews on Teams for access.';
    const TEAMS_HREF = 'https://teams.microsoft.com/l/chat/0/0?users=erick.mathews@nice.com';

    /* ---- footer --------------------------------------------------------- */
    /* The same three columns every migrated page passes, with this page
       ("Overview") marked active. */
    const FOOTER_COLUMNS = [
      {
        title: 'Product',
        links: [
          { label: 'Overview', href: './index.html', active: true },
          { label: 'Install Guide', href: './install-guide.html' },
          { label: 'Claude Skills', href: './claude-skills.html' },
          { label: 'The Suite', href: './the-suite.html' },
        ],
      },
      {
        title: 'Learn',
        links: [
          { label: 'Use Cases', href: './use-cases.html' },
          { label: 'Scoring', href: './scoring.html' },
          { label: 'Dashboard', href: './dashboard.html' },
          { label: 'Roadmap', href: './roadmap.html' },
        ],
      },
      {
        title: 'Reference',
        links: [
          { label: 'Release Notes', href: './release-notes.html' },
          { label: 'FAQ', href: './faq.html' },
          { label: 'Tools', href: './tools.html' },
          { label: 'Marketplace', href: './marketplace.html' },
          { label: 'Lynn', href: './lynn.html' },
        ],
      },
    ];

    const downloadPill = (key) =>
      h(
        'span',
        { key, className: 'nav-download is-disabled', 'aria-disabled': 'true' },
        'Download',
        h('span', { className: 'coming-soon-tag' }, 'Coming soon!')
      );

    /* ThemeProvider stamps `data-lynn-theme` on its own wrapper div, but the
       portalled chrome lives outside that div - so mirror the attribute onto
       <html>, where the same `[data-lynn-theme]` rules in lynn-ui.css apply
       to the whole document. */
    function ThemeBridge() {
      const { theme } = useLynnTheme();
      useEffect(() => {
        document.documentElement.setAttribute('data-lynn-theme', theme);
      }, [theme]);
      return null;
    }

    function portal(node, id) {
      const host = document.getElementById(id);
      return host ? createPortal(node, host) : null;
    }

    /* ---- icons (real glyphs, no emoji) ----------------------------------
       Tabler-style 24x24 outline paths, the same convention already used
       inline on install-guide.html's troubleshooting cards. IconPalette and
       IconRobot below are the exact paths already verified working on this
       site (install-guide.html's "Plugin won't open" and "Claude can't see
       any targets" trouble-card icons); the rest are new glyphs for
       meanings this page didn't need an icon for before. */
    const icon = (paths) =>
      h('svg', {
        width: 22,
        height: 22,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: 'currentColor',
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        'aria-hidden': true,
        style: { display: 'block' },
        dangerouslySetInnerHTML: { __html: paths },
      });

    const IconChartBar = icon('<path d="M4 19h16"/><path d="M6 19v-6"/><path d="M10 19v-10"/><path d="M14 19v-4"/><path d="M18 19v-8"/>');
    const IconChartLine = icon('<path d="M4 19h16"/><path d="M4 15l4 -6l4 3l5 -7"/>');
    const IconPalette = icon('<path d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25"/><path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>');
    const IconRobot = icon('<path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/>');
    const IconPlug = icon('<path d="M9 3v4"/><path d="M15 3v4"/><path d="M6 7h12v5a6 6 0 0 1 -12 0v-5z"/><path d="M12 18v3"/>');

    function App() {

        try {
          return sessionStorage.getItem(GATE_KEY) === '1';
        } catch (e) {
          return false;
        }
      });
      const [error, setError] = useState(undefined);

      useEffect(() => {
        // The chrome is up; let the page paint (see the gate-pending guard
        // in <head>).
        document.documentElement.classList.remove('lynn-gate-pending');
      }, []);

      const checkCode = (code) => {
        if (code === GATE_PASSWORD) {
          try {
            sessionStorage.setItem(GATE_KEY, '1');
          } catch (e) { /* unwritable store just means no persistence */ }
          setError(undefined);
          setUnlocked(true);
        } else {
          setError(GATE_ERROR);

      };

      return h(
        Fragment,
        null,
        h(ThemeBridge, { key: 'theme-bridge' }),
        h(AccessGate, {

          title: 'NiCE Designer Site Login',

          error,
          unlocked,
          ctaText: h(
            Fragment,
            null,

          ctaHref: TEAMS_HREF,

              downloadPill('download'),
